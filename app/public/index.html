<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Notenrechner — M323</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.2rem; }
    .sub { color: #888; margin-top: 0; }
    form { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 0.5rem; margin: 1rem 0; }
    input, button { padding: 0.5rem; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #ccc3; text-align: left; }
    .pass { color: #2a7; font-weight: 600; }
    .fail { color: #c33; font-weight: 600; }
    section { margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>📊 Notenrechner</h1>
  <p class="sub">M323 — Funktionale Programmierung · Demo</p>

  <form id="addForm">
    <input name="student_name" placeholder="Name"     required />
    <input name="subject"      placeholder="Fach"     required />
    <input name="grade"        placeholder="Note 1-6" type="number" step="0.1" min="1" max="6" required />
    <input name="weight"       placeholder="Gewicht"  type="number" step="0.1" min="0.1" value="1" />
    <input name="_spacer"      disabled                tabindex="-1" style="visibility:hidden" />
    <button type="submit">+ Hinzufügen</button>
  </form>

  <section>
    <h2>Auswertung pro Schüler:in</h2>
    <table id="reportTable">
      <thead>
        <tr>
          <th>Name</th><th>Anzahl</th><th>Ø</th><th>Ø gewichtet</th>
          <th>Bestanden</th><th>Ungenügend</th><th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Alle Noten</h2>
    <table id="gradesTable">
      <thead><tr><th>Name</th><th>Fach</th><th>Note</th><th>Gewicht</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    // Auch hier: FP-Stil — map auf Datenarrays
    const $ = (s) => document.querySelector(s);

    const renderReport = (rows) => {
      $('#reportTable tbody').innerHTML = rows
        .map((r) => `
          <tr>
            <td>${r.name}</td>
            <td>${r.count}</td>
            <td>${r.average}</td>
            <td>${r.weightedAverage}</td>
            <td>${r.passing}</td>
            <td>${r.failing}</td>
            <td class="${r.passed ? 'pass' : 'fail'}">${r.passed ? '✓ bestanden' : '✗ ungenügend'}</td>
          </tr>`)
        .join('');
    };

    const renderGrades = (rows) => {
      $('#gradesTable tbody').innerHTML = rows
        .map((g) => `<tr><td>${g.student_name}</td><td>${g.subject}</td><td>${g.grade}</td><td>${g.weight}</td></tr>`)
        .join('');
    };

    const refresh = async () => {
      const [report, grades] = await Promise.all([
        fetch('/api/report').then((r) => r.json()),
        fetch('/api/grades').then((r) => r.json()),
      ]);
      renderReport(report);
      renderGrades(grades);
    };

    $('#addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd.entries());
      body.grade  = parseFloat(body.grade);
      body.weight = parseFloat(body.weight);
      delete body._spacer;
      await fetch('/api/grades', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      e.target.reset();
      e.target.weight.value = 1;
      refresh();
    });

    refresh();
  </script>
</body>
</html>
